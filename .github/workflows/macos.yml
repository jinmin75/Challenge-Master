# Builds and smoke-tests the macOS app on GitHub-hosted Macs (free for public repositories),
# so the Mac build is verified without owning a Mac. Also runs the unit tests on Linux and Windows.
name: packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --omit=optional
      - run: npm test
      - run: npm run check
      - name: Korean names survive the OS unzip tool (Wiki export zip)
        if: runner.os == 'macOS'
        run: |
          node scripts/zip-check.mjs write "$RUNNER_TEMP/check.zip"
          ditto -x -k "$RUNNER_TEMP/check.zip" "$RUNNER_TEMP/unzipped"
          node scripts/zip-check.mjs verify "$RUNNER_TEMP/unzipped"
      # L25: the calendar in real Chrome (preinstalled on hosted runners). playwright-core stays out of
      # package.json so the app package never carries it.
      - name: Browser calendar check
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save playwright-core@1.63.0
          PLAYWRIGHT_CORE="$RUNNER_TEMP/pw/node_modules/playwright-core" node scripts/browser-calendar.mjs

  macos-app:
    needs: unit-tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --omit=optional
      - run: node scripts/build-macos.mjs
      - name: Smoke test on Apple Silicon
        run: node scripts/smoke-macos.mjs dist/Challenge-Master-*-macos.zip
      - name: Student flow in real Chrome on Apple Silicon
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save playwright-core@1.63.0
          mkdir -p "$RUNNER_TEMP/app" && ditto -x -k dist/Challenge-Master-*-macos.zip "$RUNNER_TEMP/app"
          export CHALLENGE_MASTER_FOREGROUND=1 PLAYWRIGHT_CORE="$RUNNER_TEMP/pw/node_modules/playwright-core"
          node scripts/browser-installed.mjs "$RUNNER_TEMP/app/Challenge Master.app/Contents/MacOS/challenge-master" --no-browser
      - uses: actions/upload-artifact@v7
        with:
          name: challenge-master-macos
          path: |
            dist/Challenge-Master-*-macos.zip
            dist/Challenge-Master-*-macos.zip.sha256
          retention-days: 30

  macos-intel-smoke:
    needs: macos-app
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: challenge-master-macos
          path: dist
      - name: Smoke test the same zip on an Intel Mac
        run: node scripts/smoke-macos.mjs dist/Challenge-Master-*-macos.zip
      - name: Student flow in real Chrome on an Intel Mac
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save playwright-core@1.63.0
          mkdir -p "$RUNNER_TEMP/app" && ditto -x -k dist/Challenge-Master-*-macos.zip "$RUNNER_TEMP/app"
          export CHALLENGE_MASTER_FOREGROUND=1 PLAYWRIGHT_CORE="$RUNNER_TEMP/pw/node_modules/playwright-core"
          node scripts/browser-installed.mjs "$RUNNER_TEMP/app/Challenge Master.app/Contents/MacOS/challenge-master" --no-browser
